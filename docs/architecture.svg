<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 870" width="1400" height="870" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .t  { font-size: 17px; font-weight: 650; fill: #0f172a; }
      .h  { font-size: 15px; font-weight: 650; fill: #0f172a; }
      .b  { font-size: 13px; fill: #334155; }
      .s  { font-size: 12px; fill: #475569; }
      .m  { font-size: 12.5px; fill: #1e293b; font-family: ui-monospace, 'SF Mono', Menlo, monospace; }
      .l  { font-size: 12px; fill: #475569; }
      .ln { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    </style>
  </defs>

  <rect width="1400" height="870" fill="#ffffff"/>
  <text x="30" y="42" font-size="22" font-weight="700" fill="#0f172a">Nova: what happens in one chat turn</text>
  <text x="30" y="64" class="s">Code decides who sees what and what gets written. The 2B model decides which tool to call and how to say it.</text>

  <!-- Customer -->
  <rect x="30" y="100" width="200" height="130" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="50" y="128" class="h">Customer</text>
  <text x="50" y="152" class="b">Chat page in the browser</text>
  <text x="50" y="172" class="s">signed in as one demo</text>
  <text x="50" y="188" class="s">customer (session cookie)</text>
  <text x="50" y="212" class="s">novasupportagent.vercel.app</text>

  <!-- Backend -->
  <rect x="330" y="88" width="700" height="472" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="350" y="116" class="t">Backend · FastAPI on Cloud Run</text>

  <rect x="350" y="134" width="200" height="112" rx="10" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="366" y="160" class="h">1 · Input check</text>
  <text x="366" y="183" class="b">Flags injection attempts</text>
  <text x="366" y="201" class="b">and encoded text before</text>
  <text x="366" y="219" class="b">the model reads them</text>

  <rect x="575" y="134" width="210" height="112" rx="10" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="591" y="160" class="h">2 · Agent loop</text>
  <text x="591" y="183" class="b">Nova calls a tool or replies;</text>
  <text x="591" y="201" class="b">up to 4 model calls a turn,</text>
  <text x="591" y="219" class="b">status lines stream out</text>

  <rect x="810" y="134" width="200" height="112" rx="10" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="826" y="160" class="h">3 · Reply checks</text>
  <text x="826" y="183" class="b">Removes tool names, claims</text>
  <text x="826" y="201" class="b">no tool backs, prompt echoes,</text>
  <text x="826" y="219" class="b">other people's names</text>

  <path d="M550,190 L573,190" class="ln"/>
  <path d="M785,190 L808,190" class="ln"/>

  <!-- Tools -->
  <rect x="350" y="276" width="435" height="166" rx="10" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="366" y="302" class="h">Six tools, scoped to the signed-in customer</text>
  <text x="366" y="328" class="m">list_my_orders</text>
  <text x="366" y="350" class="m">get_order_status</text>
  <text x="366" y="372" class="m">get_tracking</text>
  <text x="576" y="328" class="m">search_help_center</text>
  <text x="576" y="350" class="m">propose_return</text>
  <text x="576" y="372" class="m">escalate_to_human</text>
  <text x="366" y="402" class="s">The customer's identity comes from the session, never from</text>
  <text x="366" y="420" class="s">the model. Policy answers come from the help center, not weights.</text>
  <path d="M680,246 L680,274" class="ln" style="marker-start:url(#a)"/>

  <rect x="805" y="276" width="205" height="76" rx="10" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="821" y="301" class="h">Hand-off rules</text>
  <text x="821" y="322" class="b">Lost parcels, repeated</text>
  <text x="821" y="339" class="b">failures: a ticket, in code</text>

  <rect x="805" y="366" width="205" height="76" rx="10" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="821" y="391" class="h">Privacy trim</text>
  <text x="821" y="412" class="b">Drops fields no answer</text>
  <text x="821" y="429" class="b">needs from tool results</text>

  <!-- Confirm route -->
  <rect x="350" y="462" width="660" height="78" rx="10" fill="#fefce8" stroke="#facc15"/>
  <text x="366" y="488" class="h">Confirm route · POST /returns/confirm · the only write</text>
  <text x="366" y="510" class="b">Nova can only propose a return. It is created when the customer clicks the Confirm card,</text>
  <text x="366" y="528" class="b">under its own database role. Eligibility (window, category, delivered) is checked here.</text>

  <!-- Customer <-> backend -->
  <path d="M230,145 L328,145" class="ln"/>
  <text x="246" y="137" class="l">message</text>
  <path d="M330,190 L232,190" class="ln"/>
  <text x="244" y="182" class="l">streamed</text>
  <text x="244" y="208" class="l">reply, card</text>
  <path d="M130,230 L130,500 L348,500" class="ln"/>
  <text x="142" y="490" class="l">clicks Confirm</text>

  <!-- Model -->
  <rect x="1110" y="100" width="260" height="190" rx="14" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="1130" y="128" class="t">Model server</text>
  <text x="1130" y="154" class="b">Nova: Qwen3.5-2B fine-tuned</text>
  <text x="1130" y="173" class="b">with LoRA, merged, FP8</text>
  <text x="1130" y="200" class="b">vLLM on one L4 GPU (Modal)</text>
  <text x="1130" y="227" class="s">Scales to zero when idle;</text>
  <text x="1130" y="244" class="s">about 2 minutes to wake.</text>
  <text x="1130" y="268" class="s">API key required.</text>
  <path d="M1030,170 L1108,170" class="ln" style="marker-start:url(#a)"/>
  <text x="1040" y="160" class="l">chat API</text>

  <!-- Traces -->
  <rect x="1110" y="330" width="260" height="96" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="1130" y="358" class="h">Traces · Langfuse</text>
  <text x="1130" y="381" class="b">Every turn: model calls, tools,</text>
  <text x="1130" y="399" class="b">checks, thumbs. Text masked.</text>
  <path d="M1030,378 L1108,378" class="ln"/>

  <!-- Store -->
  <rect x="330" y="600" width="700" height="106" rx="14" fill="#f0fdf4" stroke="#86efac"/>
  <text x="350" y="628" class="t">Store · Postgres on Neon</text>
  <text x="350" y="653" class="b">Orders, tracking, returns, tickets for a made-up shop, NimbusCart. Row-level security and three roles:</text>
  <text x="350" y="672" class="b">the agent reads only the signed-in customer's rows; only the confirm role inserts a return.</text>
  <text x="350" y="692" class="b">Help-center pages, chunked and embedded with pgvector (bge-small) for search_help_center.</text>
  <path d="M567,560 L567,598" class="ln" style="marker-start:url(#a)"/>
  <text x="578" y="584" class="l">agent role: read</text>
  <path d="M900,560 L900,598" class="ln"/>
  <text x="911" y="584" class="l">confirm role: insert return</text>

  <!-- Offline -->
  <rect x="30" y="736" width="1340" height="112" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="50" y="762" class="h">How the model was made (offline)</text>
  <text x="50" y="790" class="b">Bitext replies rewritten in Nova's voice</text>
  <text x="50" y="808" class="s">SFT-1 learned the voice and stopped</text>
  <text x="50" y="825" class="s">calling tools: worse than no fine-tune</text>
  <path d="M318,800 L346,800" class="ln"/>
  <text x="360" y="790" class="b">A teacher model chats inside the real loop,</text>
  <text x="360" y="808" class="s">with the real tools and store; hard filters</text>
  <text x="360" y="825" class="s">keep 9,485 good model calls</text>
  <path d="M652,800 L680,800" class="ln"/>
  <text x="694" y="790" class="b">SFT-2a: LoRA r16 on Qwen3.5-2B</text>
  <text x="694" y="808" class="s">one epoch, about 15 minutes</text>
  <text x="694" y="825" class="s">on one A100</text>
  <path d="M926,800 L954,800" class="ln"/>
  <text x="968" y="790" class="b">Release gate before it ships</text>
  <text x="968" y="808" class="s">107 golden cases ×3, 50 fresh cases written last,</text>
  <text x="968" y="825" class="s">40 attacks; hard rules must pass every time</text>
</svg>
