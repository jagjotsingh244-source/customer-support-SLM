# Local Postgres with pgvector for NimbusCart.
# Start: docker compose up -d     Stop: docker compose down
# Connect: psql postgresql://nimbus:nimbus@localhost:5433/nimbus
# Host port is 5433, not the default 5432: a system-wide PostgreSQL 18
# already listens on 5432 on this Mac. Inside Docker it is still 5432.
# These credentials are for local development only.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: nimbus
      POSTGRES_PASSWORD: nimbus
      POSTGRES_DB: nimbus
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nimbus -d nimbus"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
