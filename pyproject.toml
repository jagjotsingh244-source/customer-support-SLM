[project]
name = "nimbus"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "faker>=40.62.0",
    "google-genai>=3.6.1",
    "openai>=3.57.0",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "pyyaml>=6.0.3",
]

[dependency-groups]
data = [
    "datasets>=5.2.0",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "pandas>=3.1.1",
]
dev = [
    "pytest>=9.2.0",
]
local-model = [
    "torch==2.15.0",
    "transformers==5.23.0",
]
