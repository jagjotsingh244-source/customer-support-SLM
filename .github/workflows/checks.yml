name: checks

on:
  push:
  pull_request:

jobs:
  clock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Only config.py may read the clock
        run: bash scripts/check_clock.sh

  help-center:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Help center follows its writing rules and matches the seed
        run: uv run --frozen python scripts/check_kb.py

  store:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nimbus
          POSTGRES_PASSWORD: nimbus
          POSTGRES_DB: nimbus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nimbus -d nimbus"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      DB_URL: postgresql://nimbus:nimbus@localhost:5432/nimbus
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Seed the store and run its invariant checks
        run: uv run --frozen python -m db.seed
      - name: Customer-question queries return the right rows
        run: uv run --frozen python db/verify_queries.py
      - name: Help center loads as searchable sections
        run: |
          uv run --frozen python db/load_kb.py
          test "$(psql "$DB_URL" -At -c "SELECT section_id FROM kb_sections, websearch_to_tsquery('english', 'return opened electronics') q WHERE tsv @@ q ORDER BY ts_rank(tsv, q) DESC LIMIT 1")" = returns-electronics#opened-electronics
      - name: Help center loads as retrieval chunks, IDs unchanged, none over 400 tokens
        run: uv run --frozen python rag/index.py
      - name: Retrieval labels point at existing chunks
        run: uv run --frozen python evals/retrieval_eval.py --check-labels
      - name: Golden eval cases match the store and the help center
        run: uv run --frozen python evals/validate.py   # all 100 cases, every category at its quota
      - name: Phrasing probes match their golden twins, the store and the help center
        run: uv run --frozen python evals/validate.py --probes
      - name: Bad inserts are rejected
        run: test "$(psql "$DB_URL" -f db/break.sql 2>&1 | grep -c '^psql.*ERROR')" = 10

  loss-mask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Only Nova's reply is trained (Qwen3.5-2B chat template)
        # Only the tokenizer is needed, so no torch: transformers at the pinned version plus jinja2 for the template.
        run: uv run --no-project --with pytest --with jinja2 --with "transformers==5.23.0" pytest -q tests/test_masking.py
