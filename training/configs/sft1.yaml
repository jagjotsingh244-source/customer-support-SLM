# SFT-1: Nova's voice from nimbus-bitext-v1, a 16-bit LoRA over the frozen Qwen3.5-2B.
# Every setting that changes a result lives here; the run name is built from the ones that vary between runs.
#   python training/sft.py --config training/configs/sft1.yaml
#   python training/sft.py --config training/configs/sft1.yaml --set r=8 lora_alpha=8 train_rows=1000

# Model and adapter (DESIGN.md, "Fine-tuning: adapter size and training memory")
model_name: unsloth/Qwen3.5-2B
r: 16
lora_alpha: 16          # alpha / r = 1, Unsloth's Qwen3.5 recipe
lora_dropout: 0.0
target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

# Data
dataset_name: 123jagjot/nimbus-bitext-v1
dataset_revision: 975c80864824005c28c22ef0411049fb81f33c8e   # pinned, so a rerun trains on the same rows
data_version: bitext_v1
max_seq_length: 256     # dataset card: p99 245 tokens, max 255, rounded up to a multiple of 64
train_rows: null        # null = the whole train split (4,447 rows); a number = a seeded subset, for ablations

# Optimisation
learning_rate: 2.0e-4
num_train_epochs: 1     # small, repetitive data overfits fast
per_device_train_batch_size: 2
gradient_accumulation_steps: 8   # 16 effective: 278 steps for one epoch of 4,447 rows
warmup_ratio: 0.05
lr_scheduler_type: cosine
optim: adamw_8bit
weight_decay: 0.0
seed: 3407

# Watching the run
eval_steps: 25
save_steps: 50
logging_steps: 5
per_device_eval_batch_size: 8
probe_max_new_tokens: 80

# Where it goes
output_root: outputs
hub_user: 123jagjot
run_prefix: sft1
